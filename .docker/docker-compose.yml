services:
  app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATA_DIR: /data
      HF_HOME: /data/models
      PORT: "3000"
    env_file:
      - path: ../.env.local
        required: false
    volumes:
      - agent-data:/data
    restart: unless-stopped

volumes:
  agent-data: